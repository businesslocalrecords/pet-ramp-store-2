<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Core Web Vitals: prioritize the LCP hero image -->
    <link rel="preload" as="image" href="/assets/hero-ramp.svg" fetchpriority="high" />

    <!-- Primary SEO -->
    <title>PawGrip Pro — The Dog Car Ramp for Senior & Large Dogs | 250 lb Capacity</title>
    <meta
      name="description"
      content="Protect your dog's joints and your back. The PawGrip Pro telescoping dog car ramp holds up to 250 lbs, fits any vehicle, and folds flat. Free shipping and a 30-day money-back guarantee."
    />
    <meta
      name="keywords"
      content="dog car ramp, foldable dog ramp, pet ramp for SUV, dog ramp for large dogs, senior dog ramp, arthritis dog ramp, telescoping dog ramp"
    />
    <link rel="canonical" href="https://pawgrippro.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="product" />
    <meta property="og:site_name" content="PawGrip Pro" />
    <meta property="og:title" content="PawGrip Pro — The Dog Car Ramp for Senior & Large Dogs" />
    <meta
      property="og:description"
      content="250 lb capacity, vet-approved gentle slope, folds flat in seconds. Free insured shipping and a 30-day money-back guarantee on every order."
    />
    <meta property="og:image" content="https://pawgrippro.com/assets/hero-ramp.svg" />
    <meta property="og:url" content="https://pawgrippro.com/" />
    <meta property="product:price:amount" content="149" />
    <meta property="product:price:currency" content="USD" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PawGrip Pro — The Dog Car Ramp for Senior & Large Dogs" />
    <meta
      name="twitter:description"
      content="250 lb capacity, vet-approved gentle slope, folds flat in seconds. Free shipping and a 30-day money-back guarantee."
    />
    <meta name="twitter:image" content="https://pawgrippro.com/assets/hero-ramp.svg" />

    <!-- Product structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "PawGrip Pro Dog Car Ramp",
        "image": "https://pawgrippro.com/assets/hero-ramp.svg",
        "description": "Telescoping dog car ramp with a vet-approved gentle slope, rated to 250 lbs. Folds flat for storage in any vehicle. Free insured shipping and a 30-day money-back guarantee.",
        "brand": { "@type": "Brand", "name": "PawGrip Pro" },
        "offers": {
          "@type": "Offer",
          "url": "https://pawgrippro.com/",
          "priceCurrency": "USD",
          "price": "149",
          "availability": "https://schema.org/InStock",
          "shippingDetails": {
            "@type": "OfferShippingDetails",
            "shippingRate": { "@type": "MonetaryAmount", "value": "0", "currency": "USD" }
          },
          "hasMerchantReturnPolicy": {
            "@type": "MerchantReturnPolicy",
            "merchantReturnDays": 30,
            "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow"
          }
        },
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "4.9",
          "reviewCount": "2847"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

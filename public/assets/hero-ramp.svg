<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAFAF9"/>
      <stop offset="100%" stop-color="#F5F5F4"/>
    </linearGradient>
    <linearGradient id="rampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#44403C"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="rampTread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57534E"/>
      <stop offset="50%" stop-color="#78716C"/>
      <stop offset="100%" stop-color="#57534E"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E7E5E4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#1C1917" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="900" fill="url(#bg)"/>

  <!-- Symmetric geometric backdrop -->
  <g opacity="0.35">
    <circle cx="600" cy="420" r="380" stroke="#D6D3D1" stroke-width="1.5" fill="none"/>
    <circle cx="600" cy="420" r="300" stroke="#D6D3D1" stroke-width="1.5" fill="none"/>
    <circle cx="600" cy="420" r="220" stroke="#E7E5E4" stroke-width="1.5" fill="none"/>
    <line x1="600" y1="40" x2="600" y2="800" stroke="#E7E5E4" stroke-width="1.5"/>
    <line x1="220" y1="420" x2="980" y2="420" stroke="#E7E5E4" stroke-width="1.5"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="700" width="1200" height="200" fill="#E7E5E4"/>
  <line x1="0" y1="700" x2="1200" y2="700" stroke="#D6D3D1" stroke-width="2"/>

  <!-- Vehicle (SUV silhouette) -->
  <g filter="url(#softShadow)">
    <!-- Body -->
    <path d="M700 440 L720 380 Q740 300 830 290 L980 290 Q1060 296 1090 380 L1110 440 L1120 620 Q1120 650 1090 650 L1010 650 Q1000 600 960 595 Q920 590 910 650 L870 650 Q860 590 820 585 Q780 590 770 650 L720 650 Q700 650 700 620 Z" fill="url(#carGrad)"/>
    <!-- Wheels -->
    <circle cx="800" cy="648" r="42" fill="#292524"/>
    <circle cx="800" cy="648" r="18" fill="#D6D3D1"/>
    <circle cx="1000" cy="648" r="42" fill="#292524"/>
    <circle cx="1000" cy="648" r="18" fill="#D6D3D1"/>
    <!-- Window -->
    <path d="M760 390 Q775 330 830 322 L960 322 Q1020 326 1048 390 Z" fill="#44403C" opacity="0.85"/>
    <path d="M775 385 Q788 340 830 334 L890 334 L890 385 Z" fill="#292524" opacity="0.6"/>
    <!-- Tail light -->
    <rect x="1108" y="470" width="14" height="34" rx="6" fill="#DC2626"/>
    <!-- Bumper -->
    <rect x="700" y="600" width="420" height="26" rx="10" fill="#D6D3D1"/>
  </g>

  <!-- Open trunk -->
  <path d="M1090 380 L1140 330 L1150 470 L1112 460 Z" fill="#292524" opacity="0.9"/>
  <path d="M700 440 L680 350 L730 340 L745 435 Z" fill="#44403C" opacity="0.5"/>

  <!-- RAMP (focal point - geometric) -->
  <g filter="url(#softShadow)">
    <!-- Ramp side rail -->
    <path d="M120 664 L660 480 L668 500 L128 686 Z" fill="url(#rampGrad)"/>
    <!-- Ramp surface -->
    <path d="M128 686 L668 500 L680 528 L140 716 L136 712 Z" fill="url(#rampTread)"/>
    <!-- Ramp edge protector -->
    <path d="M660 480 L680 470 L690 490 L668 500 Z" fill="#1C1917"/>
    <!-- Ramp feet -->
    <rect x="110" y="686" width="40" height="26" rx="6" fill="#1C1917"/>
    <rect x="650" y="478" width="40" height="26" rx="6" fill="#1C1917"/>
    <!-- Tread lines (symmetric) -->
    <g stroke="#A8A29E" stroke-width="2" opacity="0.55">
      <line x1="180" y1="656" x2="192" y2="692"/>
      <line x1="240" y1="630" x2="252" y2="666"/>
      <line x1="300" y1="604" x2="312" y2="640"/>
      <line x1="360" y1="578" x2="372" y2="614"/>
      <line x1="420" y1="552" x2="432" y2="588"/>
      <line x1="480" y1="526" x2="492" y2="562"/>
      <line x1="540" y1="500" x2="552" y2="536"/>
      <line x1="600" y1="474" x2="612" y2="510"/>
    </g>
  </g>

  <!-- DOG (white shepherd style, geometric) -->
  <g filter="url(#softShadow)">
    <!-- Body -->
    <ellipse cx="400" cy="560" rx="120" ry="58" fill="#FFFFFF"/>
    <!-- Back haunch -->
    <circle cx="470" cy="565" r="52" fill="#F5F5F4"/>
    <!-- Chest/shoulder -->
    <circle cx="325" cy="560" r="50" fill="#FFFFFF"/>
    <!-- Front legs -->
    <rect x="300" y="595" width="20" height="80" rx="10" fill="#FFFFFF"/>
    <rect x="345" y="600" width="20" height="76" rx="10" fill="#F5F5F4"/>
    <!-- Back legs -->
    <rect x="450" y="595" width="22" height="80" rx="11" fill="#F5F5F4"/>
    <rect x="490" y="600" width="20" height="76" rx="10" fill="#E7E5E4"/>
    <!-- Neck -->
    <path d="M290 520 Q270 480 250 450 L290 440 Q315 480 325 520 Z" fill="#FFFFFF"/>
    <!-- Head -->
    <ellipse cx="245" cy="450" rx="56" ry="46" fill="#FFFFFF"/>
    <!-- Snout -->
    <ellipse cx="196" cy="462" rx="28" ry="20" fill="#F5F5F4"/>
    <circle cx="184" cy="456" r="8" fill="#1C1917"/>
    <!-- Ears -->
    <path d="M225 410 Q205 370 232 378 Q248 392 246 414 Z" fill="#E7E5E4"/>
    <path d="M268 408 Q290 372 268 382 Q252 392 250 414 Z" fill="#D6D3D1"/>
    <!-- Eye -->
    <circle cx="228" cy="440" r="6" fill="#1C1917"/>
    <circle cx="230" cy="438" r="2" fill="#FFFFFF"/>
    <!-- Tail -->
    <path d="M520 540 Q580 500 600 440 Q610 470 590 520 Q575 555 525 560 Z" fill="#F5F5F4"/>
    <!-- Collar (gold accent) -->
    <path d="M268 482 Q285 496 300 512" stroke="url(#goldGrad)" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating trust badge - 30 day -->
  <g transform="translate(150,150)" filter="url(#softShadow)">
    <rect width="200" height="72" rx="16" fill="#1C1917"/>
    <circle cx="42" cy="36" r="22" fill="#FBBF24"/>
    <path d="M32 36 L40 44 L54 28" stroke="#1C1917" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="32" font-family="system-ui" font-size="14" font-weight="700" fill="#FAFAF9">30-Day Guarantee</text>
    <text x="76" y="52" font-family="system-ui" font-size="12" fill="#A8A29E">Risk-free trial</text>
  </g>

  <!-- Floating trust badge - vet approved -->
  <g transform="translate(880,120)" filter="url(#softShadow)">
    <rect width="190" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="42" cy="36" r="22" fill="#FEF3C7"/>
    <path d="M36 26 L36 40 M42 26 L42 40 M30 33 L48 33" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
    <text x="76" y="32" font-family="system-ui" font-size="14" font-weight="700" fill="#1C1917">Vet Approved</text>
    <text x="76" y="52" font-family="system-ui" font-size="12" fill="#78716C">Joint-safe design</text>
  </g>

  <!-- Angle indicator showing gentle slope -->
  <g transform="translate(300,600)">
    <path d="M0 100 L300 0" stroke="#FBBF24" stroke-width="3" stroke-dasharray="8 6"/>
    <path d="M0 100 A100 100 0 0 1 71 29" stroke="#D97706" stroke-width="2" fill="none"/>
    <text x="20" y="70" font-family="system-ui" font-size="13" font-weight="700" fill="#D97706">Gentle 26&#176; slope</text>
  </g>

  <!-- Weight capacity badge -->
  <g transform="translate(880,570)" filter="url(#softShadow)">
    <rect width="200" height="72" rx="16" fill="#FFFFFF"/>
    <circle cx="42" cy="36" r="22" fill="#ECFDF5"/>
    <path d="M42 22 L48 34 L60 35 L51 43 L53 55 L42 49 L31 55 L33 43 L24 35 L36 34 Z" fill="#059669"/>
    <text x="76" y="32" font-family="system-ui" font-size="14" font-weight="700" fill="#1C1917">250 lb Capacity</text>
    <text x="76" y="52" font-family="system-ui" font-size="12" fill="#78716C">Tested &amp; certified</text>
  </g>
</svg>